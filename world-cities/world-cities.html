    <title>World Cities Map</title>
    <style>
      :root {
        --bg: #f4f6f7;
        --panel: #ffffff;
        --ink: #1c2733;
        --ink-soft: #4a5a68;
        --line: #d5dde2;
        --map-bg: #e9f0f3;
        --grid: #c3d2da;
        --grid-major: #9db4c0;
        --equator: #7d99a8;
        --axis-label: #5d7280;
        --map-label: #22313d;
        --leader: #8fa5b1;
        --btn-bg: #ffffff;
        --btn-ink: #1c2733;
        --btn-line: #b9c7cf;
        --btn-on-bg: #d3e5ef;
        --btn-on-line: #7ba7bc;
        --tooltip-bg: #16222c;
        --tooltip-ink: #f2f6f8;
        --row-alt: #f0f3f5;
        --row-hover: #dde8ee;
        --dot: #14222e;
        --dot-ring: #f7fafb;
        --tropics-fill: rgba(238, 172, 54, 0.15);
        --tropics-line: #bd8627;
        --polar-fill: rgba(110, 165, 195, 0.16);
        --polar-line: #5f8aa0;
        --tz-band: rgba(62, 86, 102, 0.08);
        --home-tz-fill: rgba(255, 183, 28, 0.26);
        --leg-ink: #46586a;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0e141a;
          --panel: #16202a;
          --ink: #e8eff3;
          --ink-soft: #a7b8c2;
          --line: #2c3d49;
          --map-bg: #132029;
          --grid: #27404e;
          --grid-major: #38586a;
          --equator: #527a8f;
          --axis-label: #7e97a6;
          --map-label: #dce7ec;
          --leader: #4d6a7a;
          --btn-bg: #1d2c38;
          --btn-ink: #e8eff3;
          --btn-line: #3a5263;
          --btn-on-bg: #2b4a5f;
          --btn-on-line: #527a8f;
          --tooltip-bg: #eef4f7;
          --tooltip-ink: #14202a;
          --row-alt: #1a2833;
          --row-hover: #243a4a;
          --dot: #14222e;
          --dot-ring: #f7fafb;
          --tropics-fill: rgba(238, 172, 54, 0.13);
          --tropics-line: #d9a441;
          --polar-fill: rgba(110, 165, 195, 0.14);
          --polar-line: #7fb0c9;
          --tz-band: rgba(190, 215, 230, 0.055);
          --home-tz-fill: rgba(255, 183, 28, 0.24);
          --leg-ink: #c3d3dd;
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      /* iOS Safari otherwise auto-inflates text by a factor it picks
         per element, which would scale the small header labels and
         the row text differently; pin both to their declared sizes. */
      html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        max-width: 1120px;
        margin: 0 auto;
        padding: 20px 16px 36px;
      }
      h1 {
        font-size: 22px;
        font-weight: 650;
        letter-spacing: 0.01em;
        margin: 4px 0 14px;
      }
      .map-wrap {
        position: relative;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        overflow: hidden;
      }
      svg#map {
        display: block;
        width: 100%;
        height: auto;
        user-select: none;
        -webkit-user-select: none;
      }
      /* Growth animations scale these via CSS transforms (WAAPI):
         each population circle about its own centre, each elevation
         line vertically from its dot end. */
      svg#map .grow-c { transform-box: fill-box; transform-origin: center; }
      svg#map .grow-l { transform-box: fill-box; transform-origin: 50% 100%; }
      .controls {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
        margin-top: 8px;
      }
      .controls button {
        appearance: none;
        border: 1px solid var(--btn-line);
        background: var(--btn-bg);
        color: var(--btn-ink);
        border-radius: 5px;
        min-width: 0;
        height: 24px;
        padding: 0 8px;
        font-size: 11px;
        line-height: 1;
        font-family: inherit;
        cursor: pointer;
        box-shadow: 0 1px 2px rgba(10, 25, 35, 0.14);
      }
      .controls button.reset { font-size: 11px; font-weight: 600; letter-spacing: 0.02em; }
      /* Mode buttons (Labels / Population / Elevation) show their
         ON state by colour alone — a soft tinted fill and border —
         while their text never changes. */
      .controls button.mode-on { background: var(--btn-on-bg); border-color: var(--btn-on-line); }
      .controls button:active { transform: translateY(1px); }
      .tooltip {
        position: absolute;
        pointer-events: none;
        background: var(--tooltip-bg);
        color: var(--tooltip-ink);
        border-radius: 7px;
        padding: 7px 10px;
        font-size: 12.5px;
        line-height: 1.45;
        opacity: 0;
        transition: opacity 0.12s ease;
        z-index: 4;
        max-width: 230px;
        box-shadow: 0 4px 14px rgba(5, 15, 22, 0.28);
      }
      .tooltip.show { opacity: 1; }
      .tooltip .t-name { font-weight: 700; font-size: 13.5px; }
      .tooltip .t-sub { opacity: 0.82; }
      /* The city list: a static header bar sitting ABOVE the
         scroll box, completely outside the scrolling content —
         no position:sticky, no scroll listener, no transform
         pinning anywhere. Alignment between the header and the
         rows is by construction on a single shared CSS grid:
         the four column tracks are defined ONCE in --cols on
         .list-wrap, and both the header bar (.list-head) and
         every city row (.city-row) are grids using that exact
         template, so their column boundaries are the same
         arithmetic on both sides, on any engine. (Four earlier
         table-based constructions — separate sticky header
         table, script-measured width copy, two matched
         fixed-layout tables, and a single table with a pinned
         header — all misaligned or lost the header on a real
         iPhone; there is no table layout, no colgroup, and no
         width measuring or copying left.) The scroll box hides
         its scrollbar outright — zero layout width on every
         platform — so the rows' grid width always equals the
         header bar's width exactly; scrolling still works by
         touch, wheel, trackpad and keyboard. The box is exactly
         ten rows tall, so browsing all 44 cities never means
         scrolling the whole page; row and header heights are
         pinned via the variables below — borders included — on
         desktop and mobile alike. */
      .list-wrap {
        --row-h: 36px;
        --head-h: 38px;
        --cols: minmax(0, 1fr) 96px 100px 76px;
        margin-top: 18px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        overflow: hidden;
      }
      /* The header bar: a plain static grid, the first thing in
         the bordered wrapper, directly above the scroll box. It
         is not inside the scroll content and never moves. The
         padding-right is a small header-only inset (6px, the
         same at every width): the flexible City track absorbs
         it, so the Lat/TZ/Pop header tracks sit that much
         further left while the rows and the City column stay
         exactly where they were. On the user's phone the header
         rendered a few px right of the rows (invisible in the
         test browser, which measures 0px), and the Pop sort
         arrow — absolutely positioned just past its label, into
         the cell's right padding — was left half-clipped at the
         bar's right edge; the inset also gives that arrow clear
         margin inside the bar in every sort state. */
      .list-head {
        display: grid;
        grid-template-columns: var(--cols);
        height: var(--head-h);
        border-bottom: 1px solid var(--line);
        background: var(--panel);
        padding-right: 6px;
      }
      .head-cell {
        display: flex;
        align-items: center;
        min-width: 0;
        height: var(--head-h);
        line-height: 16px;
        text-align: left;
        font-size: 12px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--ink-soft);
        padding: 0 14px;
      }
      .table-scroll {
        height: calc(var(--row-h) * 10);
        overflow-y: auto;
        overflow-x: auto;
        overscroll-behavior: contain;
        scrollbar-width: none;
        background: var(--panel);
        font-size: 14px;
      }
      .table-scroll::-webkit-scrollbar { display: none; }
      .head-cell .sort-btn {
        appearance: none;
        background: none;
        border: 0;
        margin: 0;
        padding: 0;
        color: inherit;
        font: inherit;
        letter-spacing: inherit;
        text-transform: inherit;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        position: relative;
      }
      .head-cell .sort-btn:focus-visible { outline: 2px solid var(--equator); outline-offset: 2px; }
      /* Per-column header label micro-offsets (build 15, from the
         user's phone screenshot): the City label sits 10px further
         right, Lat and TZ 5px further left, Pop unchanged. Each
         offset is a transform on that column's sort button, so the
         label AND its sort arrow (positioned relative to the
         button — see .sort-ind) move together as one unit, while
         the grid column tracks, the rows, the column boundaries
         and the header bar's 6px right inset are all untouched —
         transforms take no part in layout. City +10px starts from
         inside the cell's left padding, and Lat/TZ −5px moves
         those right-aligned labels away from the bar's right side,
         so nothing clips at either end in any sort state. */
      .head-cell .sort-btn[data-sort="city"] { transform: translateX(10px); }
      .head-cell .sort-btn[data-sort="latitude"] { transform: translateX(-5px); }
      .head-cell .sort-btn[data-sort="timezone"] { transform: translateX(-5px); }
      /* The sort indicator is OUT OF FLOW: absolutely positioned
         in the header cell's right padding, just past the label's
         right edge (4px gap + 9px glyph fits inside the 14px
         padding). It therefore takes no part in layout at all —
         sorting only swaps its glyph and opacity — so no column
         boundary and no label can move when the sort state
         changes, in any order of header clicks, AND every visible
         label keeps exactly the right edge its column's values
         have (an in-flow reserved slot would leave the numeric
         labels permanently 13px short of their values). The
         inactive arrow is fully transparent. */
      .head-cell .sort-ind {
        position: absolute;
        left: 100%;
        top: 50%;
        transform: translateY(-50%);
        width: 9px;
        margin-left: 4px;
        font-size: 9px;
        line-height: 1;
        opacity: 0;
        pointer-events: none;
      }
      .head-cell .sort-ind.on { opacity: 1; }
      /* Each city row is a grid on the SAME --cols template as
         the header bar, so its cells land on exactly the header's
         column boundaries. Cell padding matches the header cells'
         horizontal padding, so every label sits directly over its
         column's values. */
      .city-row {
        display: grid;
        grid-template-columns: var(--cols);
        height: var(--row-h);
        border-bottom: 1px solid var(--line);
        cursor: pointer;
        transition: background 0.12s ease;
      }
      .city-row:last-child { border-bottom: none; }
      .city-row:nth-child(even) { background: var(--row-alt); }
      .city-row:hover, .city-row:focus-visible { background: var(--row-hover); outline: none; }
      .city-row:active { background: var(--row-hover); }
      /* The selected city's row keeps this tint wherever the box is
         scrolled to, until another city is picked or Reset. */
      .city-row.selected { background: var(--btn-on-bg); }
      .row-cell {
        display: flex;
        align-items: center;
        min-width: 0;
        padding: 0 14px;
        line-height: 18px;
        white-space: nowrap;
        overflow: hidden;
      }
      .row-cell.num, .head-cell.num { justify-content: flex-end; text-align: right; font-variant-numeric: tabular-nums; }
      .row-cell.city { font-weight: 600; }
      .dot {
        display: inline-block;
        width: 9px; height: 9px;
        border-radius: 50%;
        margin-right: 8px;
        vertical-align: 1px;
      }
      .build-stamp {
        text-align: center;
        font-size: 11px;
        line-height: 1.4;
        color: var(--ink-soft);
        opacity: 0.75;
        margin-top: 14px;
      }
      @media (max-width: 560px) {
        main { padding: 14px 10px 28px; }
        h1 { font-size: 19px; }
        .list-wrap { --row-h: 32px; --head-h: 30px; --cols: minmax(0, 1fr) 76px 80px 60px; }
        .row-cell, .head-cell { padding: 0 7px; }
        .row-cell { line-height: 16px; }
        .head-cell { line-height: 14px; }
        .table-scroll { font-size: 12.5px; }
        .head-cell { font-size: 11px; letter-spacing: 0.02em; }
        .row-cell.city { white-space: normal; }
        .dot { margin-right: 5px; }
      }
    </style>
  </head>

    <main>
      <h1>World Cities Map</h1>

      <div class="map-wrap" id="mapWrap">
        <svg id="map" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid meet" role="img"
             aria-label="World map plotting 44 cities at their true longitude and latitude, with circle area proportional to population"></svg>
        <div class="tooltip" id="tooltip" role="dialog"></div>
      </div>
      <div class="controls">
        <button id="labelsToggle" class="reset" type="button" aria-pressed="false">Labels</button>
        <button id="popToggle" class="reset" type="button" aria-pressed="false" aria-label="Population">Pop</button>
        <button id="elevToggle" class="reset" type="button" aria-pressed="false" aria-label="Elevation">Elev</button>
        <button id="dnToggle" class="reset" type="button" aria-pressed="true">Day/Night</button>
        <button id="axisToggle" class="reset" type="button" aria-pressed="false">Long/TZ</button>
        <button id="resetBtn" class="reset" type="button">Reset</button>
      </div>

      <div class="list-wrap">
        <div class="list-head" role="row">
          <div class="head-cell" role="columnheader" aria-sort="none"><button type="button" class="sort-btn" data-sort="city">City<span class="sort-ind" aria-hidden="true"></span></button></div>
          <div class="head-cell num" role="columnheader" aria-sort="none"><button type="button" class="sort-btn" data-sort="latitude" aria-label="Latitude" title="Latitude">Lat<span class="sort-ind" aria-hidden="true"></span></button></div>
          <div class="head-cell num" role="columnheader" aria-sort="none"><button type="button" class="sort-btn" data-sort="timezone" aria-label="Time zone" title="Time zone">TZ<span class="sort-ind" aria-hidden="true"></span></button></div>
          <div class="head-cell num" role="columnheader" aria-sort="none"><button type="button" class="sort-btn" data-sort="population" aria-label="Population" title="Population">Pop<span class="sort-ind" aria-hidden="true"></span></button></div>
        </div>
        <div class="table-scroll" id="tableScroll">
          <div id="cityRows"></div>
        </div>
      </div>

      <!--
        BUILD STAMP — STANDING RULE FOR EVERY FUTURE BUILD:
        (a) Every content build increments BUILD_NO (data-build-no) by
            exactly 1, sets BUILD_DATE (data-build-date) to that build's
            date in America/Los_Angeles (YYYY-MM-DD), and sets the
            published flag (data-published) OFF (stamp shows no
            "published"), even if the edit is tiny.
        (b) When a build is published, set the published flag ON for that
            same build — the flag flip alone does NOT increment the
            number or change the date.
        (c) The stamp renders "N (YYYY-MM-DD)" plus " · Published" only
            when the flag is on.
        Keep the visible text in sync with the data attributes.
        Current: BUILD_NO = 15, BUILD_DATE = 2026-10-13, PUBLISHED = OFF
      -->
      <div class="build-stamp" data-build-no="15" data-build-date="2026-10-13" data-published="off">15 (2026-10-13)</div>
    </main>

      svg.addEventListener("mousemove", function (e) {
        var p = eventToMap(e);
        svg.style.cursor = cityAt(p.x, p.y) ? "pointer" : "";
      });

      // ---- Shared growth-animation engine ----
      // Both growth effects (population circles, elevation lines) run
      // as Web Animations API transforms, which the browser's
      // compositor drives. The previous version set SVG geometry
      // attributes (r, y2) frame-by-frame from requestAnimationFrame;
      // in the phone's web view those per-frame attribute updates
      // were not repainted smoothly, so the circles and lines snapped
      // straight to full size even though the same code animated
      // smoothly on desktop. Compositor transform animations keep
      // running at full frame rate regardless of main-thread load or
      // rAF throttling. Each circle scales about its own centre and
      // each elevation line scales vertically from its dot
      // (transform-box: fill-box — see the .grow-c / .grow-l CSS).
      // A 40 ms interval mirrors the eased progress into popScale /
      // elevScale for the leader lines and click targets, and the
      // finish path commits the exact end state. Toggling
      // mid-animation reverses from the current value, so rapid
      // clicks can't break the state. Turning a channel OFF is not
      // animated at all: channelSnap() cancels any running animation
      // and pins the end state in the same frame, so the circles or
      // lines vanish instantly. With reduced motion the growth
      // is a shorter, gentler 0.4 s rather than an instant jump,
      // since the visible growth is the feature being toggled.
      var reduceMotion = window.matchMedia &&
        window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var GROW_MS = 1000;
      var growChannels = [];
      var syncTimer = null;
      function easeInOut(t) {
        return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      }
      function makeGrowChannel(apply, targets) {
        var ch = { value: 0, from: 0, to: 0, start: 0, dur: 0,
          running: false, anims: [], apply: apply, targets: targets };
        growChannels.push(ch);
        return ch;
      }
      function channelProgress(ch, now) {
        if (!ch.running || ch.dur <= 0) return 1;
        var p = (now - ch.start) / ch.dur;
        return p >= 1 ? 1 : p;
      }
      function channelValueAt(ch, now) {
        var p = channelProgress(ch, now);
        return p >= 1 ? ch.to :
          ch.from + (ch.to - ch.from) * easeInOut(p);
      }
      function finishChannel(ch) {
        ch.running = false;
        ch.value = ch.to;
        var hadAnims = ch.anims.length > 0;
        for (var i = 0; i < ch.anims.length; i++) {
          try { ch.anims[i].commitStyles(); } catch (e) {}
          ch.anims[i].cancel();
        }
        ch.anims = [];
        if (!hadAnims) setTargets(ch, ch.to, 0);   // transition fallback: pin the end state
        ch.apply();
      }
      // Sets every target element's transform, optionally with a CSS
      // transition of the given duration (the no-WAAPI fallback path;
      // also used to pin a channel instantly to its end state).
      function setTargets(ch, target, durMs) {
        for (var i = 0; i < ch.targets.length; i++) {
          var t = ch.targets[i];
          var f = t.kind === "scaleY" ? "scaleY(" : "scale(";
          t.el.style.transition = durMs > 0 ?
            "transform " + durMs + "ms cubic-bezier(0.645, 0.045, 0.355, 1)" :
            "none";
          t.el.style.transform = f + target + ")";
        }
      }
      function syncTick() {
        var now = performance.now();
        var anyRunning = false;
        for (var i = 0; i < growChannels.length; i++) {
          var ch = growChannels[i];
          if (!ch.running) continue;
          ch.value = channelValueAt(ch, now);
          ch.apply();
          if (channelProgress(ch, now) >= 1) finishChannel(ch);
          else anyRunning = true;
        }
        if (!anyRunning && syncTimer !== null) {
          clearInterval(syncTimer);
          syncTimer = null;
        }
      }
      // Pins a channel to its target instantly: cancels any running
      // animation (WAAPI or CSS-transition fallback), sets every
      // target's transform to the end state with no transition, and
      // applies the mirrored value. Used for every OFF switch —
      // shrinking is never animated.
      function channelSnap(ch, target) {
        for (var i = 0; i < ch.anims.length; i++) ch.anims[i].cancel();
        ch.anims = [];
        ch.running = false;
        ch.from = target;
        ch.to = target;
        ch.value = target;
        setTargets(ch, target, 0);
        ch.apply();
      }
      function channelTo(ch, target) {
        var now = performance.now();
        if (ch.running) ch.value = channelValueAt(ch, now);
        for (var i = 0; i < ch.anims.length; i++) ch.anims[i].cancel();
        ch.anims = [];
        ch.from = ch.value;
        ch.to = target;
        var dist = Math.abs(target - ch.from);
        ch.dur = (reduceMotion ? 400 : GROW_MS) * dist;
        if (dist === 0 || ch.dur === 0) {
          ch.running = false;
          ch.value = target;
          setTargets(ch, target, 0);
          ch.apply();
          return;
        }
        ch.start = now;
        ch.running = true;
        if (HAS_WAAPI) {
          for (var i = 0; i < ch.targets.length; i++) {
            var t = ch.targets[i];
            var f = t.kind === "scaleY" ? "scaleY(" : "scale(";
            t.el.style.transform = f + ch.from + ")";
            ch.anims.push(t.el.animate(
              [{ transform: f + ch.from + ")" },
               { transform: f + target + ")" }],
              { duration: ch.dur,
                easing: "cubic-bezier(0.645, 0.045, 0.355, 1)",
                fill: "forwards" }));
          }
        } else {
          // Fallback for browsers that fail the WAAPI feature test:
          // CSS transitions on the same transforms — still
          // compositor-driven, so the growth stays smooth; the sync
          // interval mirrors progress and finishes the channel.
          setTargets(ch, target, ch.dur);
        }
        ch.apply();
        if (syncTimer === null) syncTimer = setInterval(syncTick, 40);
      }

      // ---- Population toggle ----
      // Default view is dots only (labels start off). Clicking Population grows
      // every city's circle from its centre dot out to full size (area
      // ∝ population) over ~1s with a smooth ease-in-out, all cities
      // together, and shows the scale legend; clicking again removes
      // the circles INSTANTLY (no shrink animation) and hides the
      // legend. popScale is the single source of truth: 0 = dots only,
      // 1 = full circles; renderPop() applies it to the leader-line
      // start points and the two groups' visibility (the circles
      // themselves are sized by their transform animations).
      // Independent of the Labels toggle, the crosshair, and the
      // pop-up.
      var popOn = false;
      var popScale = 0;
      var popBtn = document.getElementById("popToggle");
      var popTargets = [];
      CITIES.forEach(function (c) {
        popTargets.push({ el: c.circ, kind: "scale" });
      });
      var lastLeaderScale = -1;   // popScale the leader starts were last written for
      function renderPop() {
        var show = popScale > 0 || popOn;
        circlesG.style.display = show ? "" : "none";
        layoutLegends();
        // The leader start points depend only on popScale — skip
        // the 44-city rewrite when it hasn't moved since last time.
        if (popScale === lastLeaderScale) return;
        lastLeaderScale = popScale;
        CITIES.forEach(function (c) {
          var rr = c.r * popScale;
          if (c.leaderEl) {
            var er = Math.max(rr, DOT_R);
            c.leaderEl.setAttribute("x1", c.x + c.leaderDX / c.leaderDist * er);
            c.leaderEl.setAttribute("y1", c.y + c.leaderDY / c.leaderDist * er);
          }
        });
      }
      var popCh = makeGrowChannel(function () {
        popScale = popCh.value; renderPop();
      }, popTargets);
      function setPop(on) {
        popOn = on;
        popBtn.classList.toggle("mode-on", on);
        popBtn.setAttribute("aria-pressed", on ? "true" : "false");
        if (on) {
          // Make the groups visible BEFORE the animations are
          // created, in the same task as the click: an animation
          // created on a display:none subtree can have its start
          // deferred until after the next style/layout pass, which
          // showed up as a laggy start. Then grow.
          renderPop();
          channelTo(popCh, 1);
        } else {
          channelSnap(popCh, 0);   // off is instant — no shrink
        }
      }
      popBtn.addEventListener("click", function () { setPop(!popOn); });

      // ---- Elevation toggle ----
      // Grows a thin vertical line upward from each city's dot, length
      // ∝ the city's elevation (see c.elevLen), in the city's own
      // bright dot colour — the cities themselves are never
      // recoloured. Uses the same ~1s engine as Population, in both
      // dots-only and population modes; switching it off removes the
      // lines instantly. While it is on, the city pop-up also shows
      // the elevation (see showTip).
      var elevOn = false;
      var elevScale = 0;
      var elevBtn = document.getElementById("elevToggle");
      var elevTargets = [];
      CITIES.forEach(function (c) {
        elevTargets.push({ el: c.elevLine, kind: "scaleY" });
      });
      function renderElev() {
        elevG.style.display = (elevScale > 0 || elevOn) ? "" : "none";
        layoutLegends();
      }
      var elevCh = makeGrowChannel(function () {
        elevScale = elevCh.value; renderElev();
      }, elevTargets);
      function setElev(on) {
        elevOn = on;
        elevBtn.classList.toggle("mode-on", on);
        elevBtn.setAttribute("aria-pressed", on ? "true" : "false");
        if (on) {
          renderElev();   // visible first, same start fix as Population
          channelTo(elevCh, 1);
        } else {
          channelSnap(elevCh, 0);   // off is instant — no shrink
        }
      }
      elevBtn.addEventListener("click", function () { setElev(!elevOn); });

      // ---- Day/Night toggle ----
      // Shades the night side of the Earth as of the moment the
      // button is switched on (recomputed on every switch-on). The
      // terminator is latitude-dependent: with the Sun's declination
      // δ for the current date, the sunrise/sunset hour angle H at
      // latitude φ satisfies cos H = −tan φ · tan δ, and the night
      // spans the longitudes centred on the anti-solar longitude
      // (the subsolar longitude −15° × (UTC hours − 12), plus 180°)
      // with half-width 180° − H. Where cos H ≤ −1 that latitude is
      // in 24-hour daylight (no night at all); where cos H ≥ 1 it is
      // in 24-hour darkness (full-width night) — so midnight sun and
      // polar night come out of the same formula, and the terminator
      // curves with latitude instead of running straight.
      var dnOn = false;
      var dnBtn = document.getElementById("dnToggle");
      function renderNight() {
        while (nightG.firstChild) nightG.removeChild(nightG.firstChild);
        var now = new Date();
        var utcH = now.getUTCHours() + now.getUTCMinutes() / 60 +
          now.getUTCSeconds() / 3600;
        // Anti-solar longitude, normalised into (-180, 180].
        var anti = -15 * (utcH - 12) + 180;
        anti = ((anti + 180) % 360 + 360) % 360 - 180;
        if (anti === -180) anti = 180;
        // Solar declination for the current date: standard
        // approximation from the day of year (UTC).
        var y0 = Date.UTC(now.getUTCFullYear(), 0, 1);
        var doy = Math.floor((now.getTime() - y0) / 86400000) + 1;
        var decl = -23.44 * Math.cos(360 / 365 * (doy + 10) * Math.PI / 180);
        var tanD = Math.tan(decl * Math.PI / 180);
        // Night half-width, in degrees of longitude, at latitude phi.
        function nightHalf(phi) {
          if (phi === 90) return decl < 0 ? 180 : 0;
          if (phi === -90) return decl > 0 ? 180 : 0;
          var cosH = -Math.tan(phi * Math.PI / 180) * tanD;
          if (cosH <= -1) return 0;     // 24-hour daylight
          if (cosH >= 1) return 180;    // 24-hour darkness
          return 180 - Math.acos(cosH) * 180 / Math.PI;
        }
        // Sample the terminator every 2° of latitude: down the east
        // edge from the north pole, back up the west edge, closed
        // across the poles. Longitudes stay unwrapped, so x can run
        // past the map's edges; two extra copies of the path, shifted
        // one map width each way, tile the part of the night that
        // wraps across the ±180° edge onto the opposite side.
        var d = "", phi, hw;
        for (phi = 90; phi >= -90; phi -= 2) {
          hw = nightHalf(phi);
          d += (d ? "L" : "M") + X(anti + hw).toFixed(1) + " " +
            Y(phi).toFixed(1);
        }
        for (phi = -90; phi <= 90; phi += 2) {
          hw = nightHalf(phi);
          d += "L" + X(anti - hw).toFixed(1) + " " + Y(phi).toFixed(1);
        }
        d += "Z";
        [-W, 0, W].forEach(function (shift) {
          var p = el("path", { d: d, fill: "#0a1727",
            "fill-opacity": 0.42, style: "pointer-events:none" }, nightG);
          if (shift) p.setAttribute("transform", "translate(" + shift + " 0)");
        });
        nightG.style.display = "";
      }
      function setDayNight(on) {
        dnOn = on;
        dnBtn.setAttribute("aria-pressed", on ? "true" : "false");
        if (on) renderNight();   // recomputed on every switch-on
        else nightG.style.display = "none";
      }
      dnBtn.addEventListener("click", function () { setDayNight(!dnOn); });
      // Day/Night is ON by default: shade the current night side as
      // soon as the page loads; the button then toggles it off/on.
      setDayNight(true);

      // ---- Axis toggle: Longitude / Time Zone ----
      // Switches only the vertical gridlines, the bottom axis labels
      // and heading, and (in Time Zone mode) the alternating zone
      // bands plus the current-local-time clocks along the top edge
      // (see axisTzTopG above). Longitude is the default: lines
      // every 30° labelled in degrees. Time Zone: each zone is a
      // 15° band centred on its UTC meridian (offset k spans
      // 15k ± 7.5°) — lines at the band edges, labels every two
      // zones in their bands' middles, plus the checkered bands on
      // the same centred geometry. City
      // positions are plotted by exact longitude in both modes and
      // never move; latitude grid/axis are untouched.
      var tzMode = false;
      var axisBtn = document.getElementById("axisToggle");
      function setAxisMode(tz) {
        tzMode = tz;
        axisBtn.setAttribute("aria-pressed", tz ? "true" : "false");
        // Button text is fixed ("Long/TZ") and never changes; the
        // mode shows in aria-pressed, the axis heading and the grid.
        gridLon.style.display = tz ? "none" : "";
        axisLonG.style.display = tz ? "none" : "";
        gridTz.style.display = tz ? "" : "none";
        axisTzG.style.display = tz ? "" : "none";
        axisTzTopG.style.display = tz ? "" : "none";
        midnightG.style.display = tz ? "" : "none";
        homeTzG.style.display = tz ? "" : "none";
        if (tz) { updateHomeTzBand(); updateTzTimes(); }   // clocks + midnight line + home band current the moment they appear
        tzBands.style.display = tz ? "" : "none";
        axisHead.textContent = tz ? "Time zone" : "Longitude";
      }
      axisBtn.addEventListener("click", function () { setAxisMode(!tzMode); });
      setAxisMode(false);

      // ---- Labels toggle ----
      // Labels start OFF: dots only — no names, leader lines, or
      // tropic/polar annotations (they live in labelsG).
      var labelsOn = false;
      var labelsBtn = document.getElementById("labelsToggle");
      function setLabels(on) {
        labelsOn = on;
        labelsG.style.display = on ? "" : "none";
        leaders.style.display = on ? "" : "none";
        // State shows as a tinted button background; the text is
        // fixed ("Labels") and never changes.
        labelsBtn.classList.toggle("mode-on", on);
        labelsBtn.setAttribute("aria-pressed", on ? "true" : "false");
      }
      labelsBtn.addEventListener("click", function () { setLabels(!labelsOn); });
      setLabels(false);   // initial state: labels off

      // ---- Reset button: back to the initial state, instantly ----
      // Everything the page opened with, restored in one click:
      // crosshair removed; Population OFF (circles gone, size legend
      // hidden); Elevation OFF (lines gone); Day/Night ON (shading
      // shown, recomputed now); axis in Longitude mode; Labels OFF;
      // any open pop-up closed and its bright dot restored; every
      // button back to its initial aria-pressed state. The mode
      // switches reuse the toggles' own setters, whose OFF paths are
      // instant (channelSnap), so the reset never animates.
      document.getElementById("resetBtn").addEventListener("click", function () {
        hideTip();          // closes the pop-up, restores the bright dot
        hideCrosshair();
        selectRow(null);    // clears the list selection highlight
        setPop(false);
        setElev(false);
        setDayNight(true);
        setAxisMode(false);
        setLabels(false);
        resetSort();        // list back to the default latitude order
      });

      // ---- City list (rows clickable: crosshair only, no pop-up) ----
      // The rows live in the .table-scroll box (see the CSS): ten
      // rows visible, the rest reached by scrolling inside the box.
      // A row tap NEVER scrolls the page and never moves the box's
      // own scroll position — it only moves the persistent row
      // highlight and the map crosshair, so the user can keep
      // scrolling the box and tap another city right away.
      // Sortable via the column headers; the DEFAULT order is by
      // latitude descending (northernmost first), matching the map's
      // top-to-bottom direction. The map itself keeps CITIES order.
      // Sorting only re-orders the existing row elements inside the
      // box (appendChild moves them), so the rows' click/keyboard
      // selection behaviour is untouched and neither the map, the
      // crosshair/selection, nor the page position is affected.
      // Header/rows alignment needs no maintenance here: the
      // header bar (.list-head) sits statically ABOVE the box —
      // outside the scrolling content entirely, with no sticky,
      // no scroll listener and no transform pinning — and it and
      // every row are grids on the one shared --cols template
      // (see the CSS at .list-wrap), so header cells and row
      // cells share their column boundaries exactly, on every
      // platform, in every sort state.
      var tableScroll = document.getElementById("tableScroll");
      var rowsBox = document.getElementById("cityRows");
      var rowEls = [];
      // The selected row's persistent highlight: it stays on the
      // city even when scrolled out of view inside the box, until
      // another city is picked (list or map) or Reset clears it.
      var selectedTr = null;
      function selectRow(tr) {
        if (selectedTr) selectedTr.classList.remove("selected");
        selectedTr = tr;
        if (tr) tr.classList.add("selected");
      }
      CITIES.forEach(function (c) {
        var tr = document.createElement("div");
        tr.className = "city-row";
        tr.setAttribute("tabindex", "0");
        tr.setAttribute("role", "button");
        tr.setAttribute("aria-label", c.name);
        tr.addEventListener("click", function () {
          selectRow(tr);
          showCrosshair(c);
        });
        tr.addEventListener("keydown", function (ev) {
          if (ev.key === "Enter" || ev.key === " ") {
            ev.preventDefault();
            selectRow(tr);
            showCrosshair(c);
          }
        });
        var tdName = document.createElement("div");
        tdName.className = "row-cell city";
        var dot = document.createElement("span");
        dot.className = "dot";
        dot.style.background = REGION_COLORS[c.region];
        tdName.appendChild(dot);
        tdName.appendChild(document.createTextNode(c.name));
        var tdLat = document.createElement("div");
        tdLat.className = "row-cell num"; tdLat.textContent = fmtLat(c.lat);
        var tdLon = document.createElement("div");
        tdLon.className = "row-cell num"; tdLon.textContent = c.tz;
        var tdPop = document.createElement("div");
        tdPop.className = "row-cell num"; tdPop.textContent = c.pop.toFixed(1) + "M";
        tr.appendChild(tdName); tr.appendChild(tdLat);
        tr.appendChild(tdLon); tr.appendChild(tdPop);
        rowEls.push({ city: c, tr: tr });
      });

      // ---- List sorting ----
      // sortState.dir multiplies a natural-ascending comparator:
      // +1 = ascending, −1 = descending. Default: latitude with
      // dir −1 (north-to-south), the list's long-standing order.
      // First click on a header uses that column's natural first
      // direction (City A–Z, Latitude north-to-south, Time zone
      // west-to-east by UTC offset, Population largest-first);
      // clicking the same header again reverses it. Time-zone ties
      // break by longitude.
      function tzOffsetMin(tz) {
        var m = tz.replace("UTC", "").replace("−", "-").split(":");
        var sign = m[0].indexOf("-") === 0 ? -1 : 1;
        var hh = Math.abs(parseInt(m[0], 10)) || 0;
        var mm = m.length > 1 ? parseInt(m[1], 10) || 0 : 0;
        return sign * (hh * 60 + mm);
      }
      CITIES.forEach(function (c) { c.tzMin = tzOffsetMin(c.tz); });
      var SORT_CMP = {
        city: function (a, b) { return a.name.localeCompare(b.name); },
        latitude: function (a, b) { return a.lat - b.lat; },
        timezone: function (a, b) {
          return (a.tzMin - b.tzMin) || (a.lon - b.lon);
        },
        population: function (a, b) { return a.pop - b.pop; }
      };
      var SORT_FIRST_DIR = { city: 1, latitude: -1, timezone: 1, population: -1 };
      var sortState = { key: "latitude", dir: -1 };
      var sortBtns = document.querySelectorAll(".list-head .sort-btn");
      function applySort() {
        var cmp = SORT_CMP[sortState.key], dir = sortState.dir;
        var sorted = rowEls.slice().sort(function (ra, rb) {
          return cmp(ra.city, rb.city) * dir;
        });
        sorted.forEach(function (r) { rowsBox.appendChild(r.tr); });
        // A new order is browsed from its start: back to the top
        // of the box (this is also what returns the box to the top
        // on Reset, via resetSort below). The header bar is static
        // above the box, so there is nothing to re-sync.
        tableScroll.scrollTop = 0;
        sortBtns.forEach(function (btn) {
          var th = btn.parentNode;
          var ind = btn.querySelector(".sort-ind");
          // The indicator is positioned out of flow (see the
          // .sort-ind CSS): sorting only swaps its glyph and its
          // opacity class, so no header label or column boundary
          // can shift when the sort state changes.
          if (btn.getAttribute("data-sort") === sortState.key) {
            th.setAttribute("aria-sort", dir === 1 ? "ascending" : "descending");
            ind.textContent = dir === 1 ? "▲" : "▼";
            ind.classList.add("on");
          } else {
            th.setAttribute("aria-sort", "none");
            ind.textContent = "▲";
            ind.classList.remove("on");
          }
        });
      }
      function resetSort() {
        sortState = { key: "latitude", dir: -1 };
        applySort();
      }
      sortBtns.forEach(function (btn) {
        btn.addEventListener("click", function () {
          var key = btn.getAttribute("data-sort");
          if (sortState.key === key) sortState.dir = -sortState.dir;
          else sortState = { key: key, dir: SORT_FIRST_DIR[key] };
          applySort();
        });
      });
      layoutLegends();   // initial legend state (no panels — Pop and Elev both off)
      applySort();
    </script>
  </body>
</html>
