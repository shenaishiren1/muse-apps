    <title>Fruit of the Spirit</title>
    <style>
      :root {
        --page-bg: #f2f0ec;
        --ink: #26241f;
        --ink-soft: #6d675c;
        --frame: #1d1d20;
        --btn-bg: #ffffff;
        --btn-border: #c9c4ba;
        --btn-active-bg: #26241f;
        --btn-active-ink: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page-bg: #131315;
          --ink: #f0ede7;
          --ink-soft: #a39c90;
          --frame: #000000;
          --btn-bg: #232326;
          --btn-border: #45454b;
          --btn-active-bg: #f0ede7;
          --btn-active-ink: #1d1d20;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--page-bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 28px 16px 20px;
      }
      header { text-align: center; margin-bottom: 20px; }
      h1 {
        margin: 0;
        font-size: clamp(26px, 6vw, 36px);
        font-weight: 800;
        letter-spacing: -0.01em;
      }
      .ref {
        margin: 6px 0 0;
        font-size: 14px;
        color: var(--ink-soft);
        letter-spacing: 0.04em;
      }
      .cube {
        width: min(92vw, 470px);
        aspect-ratio: 1 / 1;
        background: var(--frame);
        border-radius: 20px;
        padding: 10px;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        grid-template-rows: repeat(3, minmax(0, 1fr));
        gap: 8px;
        box-shadow: 0 14px 34px rgba(0, 0, 0, 0.28);
      }
      .tile {
        background: var(--c);
        color: #ffffff;
        border-radius: 12px;
        min-width: 0;
        min-height: 0;
        container-type: inline-size;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 5%;
        padding: 8% 4% 6%;
        overflow: hidden;
      }
      

      .tile .art {
        flex: 1 1 0;
        min-height: 0;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .tile .art img {
        display: block;
        max-width: 88%;
        max-height: 100%;
        width: auto;
        height: auto;
        object-fit: contain;
      }
      .tile .art.emoji {
        container-type: size;
      }
      .tile .art .glyph {
        font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
        font-size: clamp(40px, 18vw, 96px);
        font-size: min(84cqw, 90cqh);
        line-height: 1;
      }
      

      .cube:not(.has-lang) .tile .art img { max-width: 74%; max-height: 78%; }
      .cube:not(.has-lang) .tile .art .glyph { font-size: min(66cqw, 70cqh); }
      .tile .label {
        display: none;
        font-weight: 700;
        line-height: 1.2;
        text-align: center;
        white-space: nowrap;
        color: #ffffff;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.45), 0 0 2px rgba(0, 0, 0, 0.3);
      }
      .cube.has-lang .tile .label { display: block; }
      .cube.no-images .tile .art { display: none; }
      

      .tile .art.gest { display: none; }
      .cube.gestures .tile .art.gest { display: flex; }
      .cube.gestures .tile .art.std { display: none; }
      .label .line { display: none; }
      .label .line + .line { margin-top: 2px; }
      .cube.show-en .label .en,
      .cube.show-zh .label .zh,
      .cube.show-ja .label .ja,
      .cube.show-de .label .de { display: block; }
      .label .zh { letter-spacing: 0.12em; }
      











      .label .line { font-size: 20cqw; }
      .controls {
        margin-top: 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }
      .controls .row {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
      }
      .controls button {
        font: inherit;
        font-size: 16px;
        font-weight: 600;
        width: 64px;
        height: 44px;
        padding: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        border: 1.5px solid var(--btn-border);
        background: var(--btn-bg);
        color: var(--ink);
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      .controls button:active { transform: scale(0.97); }
      .controls button.active {
        background: var(--btn-active-bg);
        color: var(--btn-active-ink);
        border-color: var(--btn-active-bg);
      }
      .controls button.emoji-btn {
        font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
        font-size: 20px;
        line-height: 1;
      }
      .controls button:focus-visible {
        outline: 3px solid #5da9e4;
        outline-offset: 2px;
      }
      .stamp {
        margin-top: auto;
        padding-top: 28px;
        font-size: 12px;
        color: var(--ink-soft);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Fruit of the Spirit</h1>
      <p class="ref">Galatians 5:22–23</p>
    </header>

    <main class="cube" id="cube" aria-label="The nine attributes of the fruit of the Spirit"></main>

    <nav class="controls" aria-label="Display options">
      <div class="row">
        <button type="button" id="btn-en" aria-pressed="false">EN</button>
        <button type="button" id="btn-zh" aria-pressed="false">中</button>
        <button type="button" id="btn-ja" aria-pressed="false">日</button>
        <button type="button" id="btn-de" aria-pressed="false">DE</button>
      </div>
      <div class="row">
        <button type="button" id="btn-gestures" class="emoji-btn" aria-pressed="false" aria-label="Toggle hand gesture images"><span aria-hidden="true">👍</span></button>
        <button type="button" id="btn-images" class="emoji-btn active" aria-pressed="true" aria-label="Toggle images"><span aria-hidden="true">😊</span></button>
      </div>
    </nav>

          2: { en: 11, de: 9.5, zh: 28, ja: 25 },
          3: { en: 9.5, de: 8, zh: 24, ja: 21.5 },
          4: { en: 8, de: 7, zh: 20, ja: 18 }
        };
        var cube = document.getElementById('cube');
        cube.innerHTML = FRUITS.map(function (f) {
          var labels = LANGS.map(function (l, i) {
            return '<span class="line ' + l.key + '" lang="' + l.htmlLang + '">' + f[i] + '</span>';
          }).join('');
          var std = f[7]
            ? '<span class="art emoji std" role="img" aria-label="' + f[6] + '"><span class="glyph" aria-hidden="true">' + f[7] + '</span></span>'
            : '<span class="art std"><img src="' + f[5] + '" alt="' + f[6] + '" width="512" height="512"></span>';
          var gest = '<span class="art emoji gest" role="img" aria-label="' + f[9] + '"><span class="glyph" aria-hidden="true">' + f[8] + '</span></span>';
          return '<div class="tile" style="--c:' + f[4] + '">' +
            std + gest +
            '<span class="label">' + labels + '</span></div>';
        }).join('');

        var on = { en: false, zh: false, ja: false, de: false };
        var buttons = {};
        LANGS.forEach(function (l) {
          var btn = document.getElementById('btn-' + l.key);
          buttons[l.key] = btn;
          btn.addEventListener('click', function () { on[l.key] = !on[l.key]; render(); });
        });

        
        
        
        
        var imgMode = 'std';
        var stdBtn = document.getElementById('btn-images');
        var gestBtn = document.getElementById('btn-gestures');
        stdBtn.addEventListener('click', function () { imgMode = imgMode === 'std' ? 'off' : 'std'; render(); });
        gestBtn.addEventListener('click', function () { imgMode = imgMode === 'gest' ? 'off' : 'gest'; render(); });

        
        
        
        
        
        
        
        function fitSharedPx(lines) {
          var tile = cube.children[0];
          var cs = getComputedStyle(tile);
          var availW = tile.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
          var arts = tile.querySelectorAll('.art');
          var art = arts[0];
          for (var a = 0; a < arts.length; a++) {
            if (getComputedStyle(arts[a]).display !== 'none') { art = arts[a]; break; }
          }
          var label = tile.querySelector('.label');
          var gap = label.offsetTop - art.offsetTop - art.offsetHeight;
          var budget = tile.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom)
            - gap - tile.clientHeight * 0.2;
          var labels = cube.querySelectorAll('.label');
          function fits(px) {
            var i;
            for (i = 0; i < lines.length; i++) lines[i].style.fontSize = px + 'px';
            for (i = 0; i < lines.length; i++) {
              if (lines[i].scrollWidth > availW + 1) return false;
            }
            for (i = 0; i < labels.length; i++) {
              if (labels[i].offsetHeight > budget + 1) return false;
            }
            return true;
          }
          var lo = 4, hi = tile.clientWidth, best = lo;
          for (var n = 0; n < 12; n++) {
            var mid = (lo + hi) / 2;
            if (fits(mid)) { best = mid; lo = mid; } else { hi = mid; }
          }
          fits(best);
          return best;
        }

        function render() {
          var count = 0;
          var cls = 'cube';
          var first = null;
          LANGS.forEach(function (l) {
            if (on[l.key]) { count++; cls += ' show-' + l.key; if (!first) first = l; }
            buttons[l.key].classList.toggle('active', on[l.key]);
            buttons[l.key].setAttribute('aria-pressed', on[l.key]);
          });
          var imagesOn = imgMode !== 'off';
          if (count) cls += ' has-lang count-' + count;
          if (!imagesOn) cls += ' no-images';
          if (imgMode === 'gest') cls += ' gestures';
          stdBtn.classList.toggle('active', imgMode === 'std');
          stdBtn.setAttribute('aria-pressed', imgMode === 'std');
          gestBtn.classList.toggle('active', imgMode === 'gest');
          gestBtn.setAttribute('aria-pressed', imgMode === 'gest');
          cube.className = cls;
          if (count) {
            var lines = cube.querySelectorAll('.label .line');
            var i;
            
            
            
            var latinCjkPair = count === 2 &&
              ((on.en || on.de) && (on.zh || on.ja));
            if (imagesOn && (count >= 3 || latinCjkPair)) {
              
              
              
              
              var px = fitSharedPx(lines);
              for (i = 0; i < lines.length; i++) lines[i].style.fontSize = px + 'px';
            } else {
              var shared = Infinity;
              if (imagesOn) {
                LANGS.forEach(function (l) {
                  if (on[l.key]) shared = Math.min(shared, FIT[count][l.key]);
                });
              } else {
                
                
                
                
                var cap = 80 / (1.2 * count);
                LANGS.forEach(function (l) {
                  if (on[l.key]) shared = Math.min(shared, FIT[1][l.key], cap);
                });
              }
              for (i = 0; i < lines.length; i++) lines[i].style.fontSize = shared + 'cqw';
            }
          }
          document.documentElement.lang = first ? first.htmlLang : 'en';
        }
        render();
        
        
        window.addEventListener('resize', render);
      })();
    </script>
  </body>
</html>
